services:

  deezspot_bot:
    image: j0n4n/deezspot_bot_docker
    container_name: deezspot_bot
    environment:
      - MODE_BOT:=
      - WARNING_BANNING=${WARNING_BANNING}
      - FLOOD_WINDOW_SECONDS=${FLOOD_WINDOW_SECONDS}
      - FLOOD_MESSAGE_LIMIT=${FLOOD_MESSAGE_LIMIT}
      - USER_ERRORS:=
      - BUNKER_CHANNEL=${BUNKER_CHANNEL}
      - OWL_CHANNEL:=
      - ROOT_ID=${ROOT_ID}
      - METHOD_SAVE=${METHOD_SAVE}
      - DOWNLOAD_DIR_MAX_SIZE=${DOWNLOAD_DIR_MAX_SIZE}
      - PROGRESS_STATUS_RATE=${PROGRESS_STATUS_RATE}
      - TIME_SLEEP=${TIME_SLEEP}
      - SECONDS_LIMITS_ALBUM=${SECONDS_LIMITS_ALBUM}
      - SECONDS_LIMITS_TRACK=${SECONDS_LIMITS_TRACK}
      - UPLOAD_MAX_SIZE_USER=${UPLOAD_MAX_SIZE_USER}
      - MAX_SONGS_PER_PLAYLIST=${MAX_SONGS_PER_PLAYLIST}
      - MAX_DOWNLOAD_USER=${MAX_DOWNLOAD_USER}
      - BOT_NAME=${BOT_NAME}
      - FORUM=${FORUM}
      - ARL_TOKEN=${ARL_TOKEN}
      - EMAIL_DEE=${EMAIL_DEE}
      - PWD_DEE=${PWD_DEE}
      - BOT_TOKEN=${BOT_TOKEN}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - ACRCLOUD_KEY=${ACRCLOUD_KEY}
      - ACRCLOUD_SECRET=${ACRCLOUD_SECRET}
      - ACRCLOUD_HOST=${ACRCLOUD_HOST}
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
    volumes:
      - ./DB:/app/DB
      - ./logs:/app/logs
      - ./credentials:/app/credentials
