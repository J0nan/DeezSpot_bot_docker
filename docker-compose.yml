services:

  deezspot_bot:
    image: j0n4n/deezspot_bot_docker
    # build: .
    container_name: deezspot_bot
    environment:
      - MODE_BOT=${MODE_BOT:-2}
      - WARNING_BANNING=${WARNING_BANNING:-6}
      - FLOOD_WINDOW_SECONDS=${FLOOD_WINDOW_SECONDS:-4}
      - FLOOD_MESSAGE_LIMIT=${FLOOD_MESSAGE_LIMIT:-12}
      - USER_ERRORS=${USER_ERRORS}
      - BUNKER_CHANNEL=${BUNKER_CHANNEL}
      - OWL_CHANNEL=${OWL_CHANNEL}
      - ROOT_ID=${ROOT_ID}
      - METHOD_SAVE=${METHOD_SAVE:-3}
      - DOWNLOAD_DIR_MAX_SIZE=${DOWNLOAD_DIR_MAX_SIZE:-6}
      - PROGRESS_STATUS_RATE=${PROGRESS_STATUS_RATE:-150}
      - TIME_SLEEP=${TIME_SLEEP:-8}
      - SECONDS_LIMITS_ALBUM=${SECONDS_LIMITS_ALBUM:-30000}
      - SECONDS_LIMITS_TRACK=${SECONDS_LIMITS_TRACK:-7200}
      - UPLOAD_MAX_SIZE_USER=${UPLOAD_MAX_SIZE_USER:-2}
      - MAX_SONGS_PER_PLAYLIST=${MAX_SONGS_PER_PLAYLIST:-200}
      - MAX_DOWNLOAD_USER=${MAX_DOWNLOAD_USER:-3}
      - BOT_NAME=${BOT_NAME:-@}
      - FORUM=${FORUM:-@}
      - ARL_TOKEN=${ARL_TOKEN}
      - EMAIL_DEE=${EMAIL_DEE}
      - PWD_DEE=${PWD_DEE}
      - BOT_TOKEN=${BOT_TOKEN}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-c6b23f1e91f84b6a9361de16aba0ae17}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-237e355acaa24636abc79f1a089e6204}
      - ACRCLOUD_KEY=${ACRCLOUD_KEY}
      - ACRCLOUD_SECRET=${ACRCLOUD_SECRET}
      - ACRCLOUD_HOST=${ACRCLOUD_HOST}
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
    volumes:
      - ./DB:/app/DB
      - ./logs:/app/logs
      - ./credentials:/app/credentials
